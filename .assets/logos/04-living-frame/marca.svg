<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="c4-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="c4-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="c4-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="c4-portal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#c4-bg)"/>
  <!-- Isometric Cube Structure -->
  <g transform="translate(256, 256)">
    <!-- Top Face (Roof Plane) -->
    <polygon points="0,-160 138,-80 0,0 -138,-80" fill="url(#c4-top)"/>
    <!-- Left Face (Solid Structural Wall) -->
    <polygon points="-138,-80 0,0 0,160 -138,80" fill="url(#c4-left)"/>
    <!-- Right Face (Wall with Portal Arch) -->
    <polygon points="0,0 138,-80 138,80 0,160" fill="url(#c4-right)"/>
    <!-- Illuminated Entrance Portal (Forms 'A' inner light) -->
    <polygon points="24,24 80,-8 80,104 24,136" fill="url(#c4-portal)"/>
    <!-- Architectural Grid Edge Highlights -->
    <line x1="0" y1="-160" x2="0" y2="0" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-138" y2="-80" stroke="#10B981" stroke-width="2"/>
    <line x1="0" y1="0" x2="138" y2="-80" stroke="#38BDF8" stroke-width="2"/>
  </g>
</svg>