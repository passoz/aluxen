    <!-- Window Grid Dots on Blocks -->
    <circle cx="150" cy="266" r="8" fill="#A7F3D0"/>
    <circle cx="190" cy="266" r="8" fill="#A7F3D0"/>
    <circle cx="150" cy="316" r="8" fill="#A7F3D0"/>
    <circle cx="190" cy="316" r="8" fill="#A7F3D0"/>
    <circle cx="312" cy="266" r="8" fill="#34D399"/>
    <circle cx="352" cy="266" r="8" fill="#34D399"/>
    <circle cx="312" cy="316" r="8" fill="#34D399"/>
    <circle cx="352" cy="316" r="8" fill="#34D399"/>
