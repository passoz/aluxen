<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="c3-key-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="c3-key-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="c3-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#c3-bg)"/>
  <g transform="translate(0, 10)">
    <!-- Roof Bow of the Key -->
    <path d="M 256 80 L 140 180 L 190 180 L 256 122 L 322 180 L 372 180 Z" fill="url(#c3-key-right)"/>
    <!-- Left Vertical Prism Shank -->
    <path d="M 210 180 L 256 140 L 256 410 L 210 410 Z" fill="url(#c3-key-left)"/>
    <!-- Right Vertical Prism Shank with Key Bit Cuts -->
    <path d="M 256 140 L 302 180 L 302 240 L 268 240 L 268 270 L 302 270 L 302 330 L 274 330 L 274 360 L 302 360 L 302 410 L 256 410 Z" fill="url(#c3-key-right)"/>
    <!-- Central Digital Keyway / Chip Aperture -->
    <rect x="238" y="210" width="36" height="64" rx="18" fill="#0A1128"/>
    <circle cx="256" cy="242" r="10" fill="url(#c3-core)"/>
    <!-- Light pulse node -->
    <circle cx="256" cy="100" r="8" fill="#67E8F9"/>
  </g>
</svg>