    <path d="M 160 360 C 110 330, 90 270, 120 220 C 150 170, 220 120, 256 80 C 292 120, 362 170, 392 220 C 422 270, 402 330, 352 360 C 300 390, 270 330, 256 300 C 242 330, 212 390, 160 360 Z"
