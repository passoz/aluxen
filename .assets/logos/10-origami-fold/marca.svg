    <!-- Origami Central Fold (Translucent Crossbar) -->
    <polygon points="186,300 326,300 300,260 212,260" fill="#022C22" opacity="0.8"/>
    <!-- Apex Corner Light Sheen -->
    <polygon points="256,90 268,118 256,128 244,118" fill="#FFFFFF" opacity="0.9"/>
