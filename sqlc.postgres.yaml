version: "2"
sql:
  - engine: "postgresql"
    schema: "schema/postgres.sql"
    queries: "queries/queries.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/infrastructure/db/postgres/sqlcgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        emit_prepared_queries: false
        emit_interface: false
