# Configuração do Air (hot reload) para desenvolvimento local
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/app"
entrypoint = "./tmp/main"
full_bin = "APP_ENV=development PORT=3000 DB_DIR=./tmp/dev-data STORAGE_DIR=./tmp/dev-data/storage SESSION_SECRET=aluxen-dev-session-secret-not-for-prod ./tmp/main"
include_ext = ["go", "html", "css", "js", "sql"]
exclude_dir = ["assets", "tmp", "vendor", "test", ".git", ".todo", ".piwerness", "data", "data-test"]
include_dir = ["cmd", "internal"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
follow_symlink = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true
main_only = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
app = "white"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
