services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - dbdata:/data
      - .:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - DB_DIR=/data
      - NODE_ENV=development
      - HOST=0.0.0.0

volumes:
  dbdata: