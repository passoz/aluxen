{{define "error.html"}}{{template "head" .}}
{{with .Data}}
<main class="login-page">
  <section class="card login-card">
    <h1>{{if eq .Status 404}}Página não encontrada{{else if eq .Status 500}}Erro interno{{else}}{{.Status}}{{end}}</h1>
    <p class="subtitle">{{.Message}}</p>
    <a class="btn btn-primary" href="/dashboard?tab=dashboard">Voltar ao painel</a>
  </section>
</main>
{{end}}
{{template "foot" .}}{{end}}
