{{define "head"}}<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="theme-color" content="#85e6c0">
  <meta name="description" content="Aluxen — gestão de locação: contratos, recibos, portal do locatário e prova de autenticidade.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aluxen">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles/globals.css">
  <link rel="stylesheet" href="/styles/panel.css">
  <script>
    // Tema aplicado antes da pintura, para não piscar claro/escuro.
    (function () {
      try {
        var theme = localStorage.getItem('aluxen.theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (error) {}
    })();
    // Estado do menu lateral, também antes da pintura: o app.js confirma e
    // mantém a classe `open` do menu em sincronia depois do boot.
    (function () {
      try {
        if (localStorage.getItem('aluxen.sidebar') === 'collapsed') {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (error) {}
    })();
  </script>
</head>
<body>
{{end}}
