{{define "sidebar"}}
<aside class="sidebar" id="sidebar">
  <div class="brand-lockup">
    <img src="/logomarca.png" alt="Aluxen" class="logo-img logo-theme-light">
    <img src="/logomarca-light.png" alt="Aluxen" class="logo-img logo-theme-dark">
  </div>
  <nav class="nav">
    <a class="nav-item{{if eq .Page "dashboard"}} active{{end}}" href="/dashboard?tab=dashboard" title="Painel">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13h6V4H4v9Zm10 7h6v-9h-6v9ZM4 20h6v-4H4v4Zm10-11h6V4h-6v5Z"/></svg></span>
      <span class="nav-label">Painel</span>
    </a>
    <a class="nav-item{{if eq .Page "tenants"}} active{{end}}" href="/dashboard?tab=tenants" title="Inquilinos">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg></span>
      <span class="nav-label">Inquilinos</span>
    </a>
    <a class="nav-item{{if eq .Page "properties"}} active{{end}}" href="/dashboard?tab=properties" title="Imóveis">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 10.5 12 4l8.5 6.5V20h-6v-5h-5v5h-6v-9.5Z"/></svg></span>
      <span class="nav-label">Imóveis</span>
    </a>
    <a class="nav-item{{if eq .Page "leases"}} active{{end}}" href="/dashboard?tab=leases" title="Contratos">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5"/><path d="M9 12h7M9 15.5h7"/></svg></span>
      <span class="nav-label">Contratos</span>
    </a>

      <span class="nav-label">Recibos</span>
    </a>

      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="3.5"/></svg></span>
      <span class="nav-label">Temporada</span>
    </a>
    <a class="nav-item{{if eq .Page "calendar"}} active{{end}}" href="/dashboard?tab=calendar" title="Calendário">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg></span>
      <span class="nav-label">Calendário</span>
    </a>
    <a class="nav-item{{if eq .Page "history"}} active{{end}}" href="/dashboard?tab=history" title="Histórico">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/><path d="M12 8.5V12l2.5 1.5"/></svg></span>
      <span class="nav-label">Histórico</span>
    </a>

    </a>

  <div class="sidebar-footer">
    <button type="button" class="btn btn-outline btn-sm" data-theme-toggle>Alternar tema</button>
    <a class="btn btn-outline btn-sm" href="/settings">Configurações</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit" class="btn btn-outline btn-sm">Sair</button>
    </form>
  </div>
</aside>
{{end}}
