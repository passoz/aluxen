{{define "modal_drilldown"}}
<div class="modal-backdrop" id="modal-drilldown" hidden>
  <div class="modal-card modal-card-wide" role="dialog" aria-modal="true" aria-label="Detalhamento financeiro">
    <div class="modal-header">
      <h3>Detalhamento financeiro</h3>
      <button type="button" class="btn btn-sm btn-secondary" data-modal-close>Fechar</button>
    </div>

    <form class="stack" data-drilldown-filters>
      <div class="drilldown-filter-grid">
        <div class="form-group">
          <label for="drilldown-from">Vencimento de</label>
          <input id="drilldown-from" name="from" type="text" data-datepicker placeholder="dd/mm/aaaa">
        </div>
        <div class="form-group">
          <label for="drilldown-to">Vencimento até</label>
          <input id="drilldown-to" name="to" type="text" data-datepicker placeholder="dd/mm/aaaa">
        </div>
        <div class="form-group">
          <label for="drilldown-status">Situação</label>
          <select id="drilldown-status" name="status">
            <option value="">Todas</option>
            <option value="paid">Pago</option>
            <option value="partial">Parcial</option>
            <option value="due">A vencer</option>
            <option value="overdue">Vencido</option>
          </select>
        </div>
        <div class="form-group">
          <label for="drilldown-category">Categoria</label>
          <select id="drilldown-category" name="category">
            <option value="">Todas</option>
            {{range .Snapshot.Metrics.Categories}}<option value="{{.Category}}">{{.Label}}</option>{{end}}
          </select>
        </div>
        <div class="form-group">
          <label for="drilldown-tenant">Inquilino</label>
          <select id="drilldown-tenant" name="tenant_id">
            <option value="">Todos</option>
            {{range .Snapshot.Tenants}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
          </select>
        </div>
        <div class="form-group">
          <label for="drilldown-property">Imóvel</label>
          <select id="drilldown-property" name="property_id">
            <option value="">Todos</option>
            {{range .Snapshot.Properties}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="drilldown-q">Buscar na descrição</label>
        <input id="drilldown-q" name="q" type="search" placeholder="Ex.: limpeza, caução, taxa">
      </div>
      <div class="row-actions">
        <button type="submit" class="btn btn-sm btn-primary">Filtrar</button>
        <button type="button" class="btn btn-sm btn-secondary" data-drilldown-clear>Limpar filtros</button>
      </div>
    </form>

    <div class="error" data-drilldown-error hidden></div>
    <p class="cell-muted" data-drilldown-status hidden>Carregando detalhamento…</p>

    <div data-drilldown-result hidden>
      <div class="metrics-grid" data-drilldown-totals></div>

      <p class="cell-muted" data-drilldown-empty hidden>Nenhum lançamento neste recorte. Ajuste os filtros ou limpe-os para ver a carteira inteira.</p>

      <div class="table-wrap" data-drilldown-table hidden>
        <table>
          <thead>
            <tr>
              <th>Vencimento</th>
              <th>Descrição</th>
              <th>Inquilino</th>
              <th>Imóvel</th>
              <th>Categoria</th>
              <th>Situação</th>
              <th style="text-align: right;">Valor</th>
              <th style="text-align: right;">Pago</th>
              <th>Recibo</th>
            </tr>
          </thead>
          <tbody data-drilldown-rows></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{{end}}
