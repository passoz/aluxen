# Aluxen — execução local da instância (app Go + volume de dados).
#
# Em produção cada cliente tem a sua própria instância (container, volume e
# subdomínio), provisionada no Easypanel; este arquivo serve para rodar a
# instância na máquina de desenvolvimento com o mesmo formato.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - aluxen-data:/data
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      # file:/data/aluxen.db (SQLite) ou postgres://user:pass@host/db (Postgres)
      - DATABASE_URL=file:/data/aluxen.db
      - DB_DIR=/data
      - STORAGE_DIR=/data/storage
      - LOG_FORMAT=json
      - TZ=America/Sao_Paulo
      - SESSION_SECRET=${SESSION_SECRET:?defina SESSION_SECRET no .env ou no ambiente}
      - SEED_USERNAME=${SEED_USERNAME:-passoz}
      - SEED_PASSWORD=${SEED_PASSWORD:-senha-de-teste}
      - DEFAULT_LANDLORD_NAME=${DEFAULT_LANDLORD_NAME:-Locador}
      - DEFAULT_LANDLORD_CPF=${DEFAULT_LANDLORD_CPF:-}
      - APP_URL=${APP_URL:-}
    healthcheck:
      test: ["CMD", "/aluxen", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aluxen-data:
    driver: local
