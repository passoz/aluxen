services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - aluxen-data:/data
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DB_DIR=/data
      - SESSION_SECRET=${SESSION_SECRET:-aluxen-session-secret-change-in-production}
      - SEED_USERNAME=${SEED_USERNAME:-passoz}
      - SEED_PASSWORD=${SEED_PASSWORD:-senha-de-teste}

volumes:
  aluxen-data:
    driver: local
