services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - aluxen-data:/data
    environment:
      - DB_DIR=/data
      - SESSION_SECRET=${SESSION_SECRET:-production-secret-change-me}
      - SEED_USERNAME=${SEED_USERNAME:-passoz}
      - SEED_PASSWORD=${SEED_PASSWORD:-Dt32btop@}

volumes:
  aluxen-data:
    driver: local