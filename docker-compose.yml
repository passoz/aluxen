# Aluxen — execução local da instância (app Go + volume de dados).
#
# O destino de produção é Kubernetes (a imagem é publicada no GHCR); este
# arquivo serve para rodar a instância na máquina de desenvolvimento com o
# mesmo formato da imagem.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - aluxen-data:/data
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      # file:/data/aluxen.db (SQLite) ou postgres://user:pass@host/db (Postgres)
      - DATABASE_URL=file:/data/aluxen.db
      - DB_DIR=/data
      - STORAGE_DIR=/data/storage
      - LOG_FORMAT=json
      - TZ=America/Sao_Paulo
      # Sem valor padrão embutido: o compose recusa subir sem estes dois. O
      # SESSION_SECRET assina a sessão, o CSRF e a chave de autenticidade dos
      # documentos — um padrão versionado permitiria forjar todos os três.
      - SESSION_SECRET=${SESSION_SECRET:?defina SESSION_SECRET com pelo menos 16 caracteres}
      - SEED_USERNAME=${SEED_USERNAME:-passoz}
      - SEED_PASSWORD=${SEED_PASSWORD:?defina SEED_PASSWORD do administrador}
      - DEFAULT_LANDLORD_NAME=${DEFAULT_LANDLORD_NAME:-Locador}
      - DEFAULT_LANDLORD_CPF=${DEFAULT_LANDLORD_CPF:-}
      - APP_URL=${APP_URL:-}
    healthcheck:
      test: ["CMD", "/aluxen", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aluxen-data:
    driver: local
