name: Publish Image

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - main
      - devgo

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: passoz/aluxen

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo: o número do build é a contagem de commits.
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'release' }}
            type=raw,value=go,enable=${{ github.ref_name == 'devgo' }}
            type=sha,prefix=sha-
          labels: |
            aluxen:go
            aluxen=go

      - name: Resolve build metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Subversão da versão exibida no painel: cresce a cada build publicado.
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALUXEN_BUILD_COMMIT=${{ github.sha }}
            ALUXEN_BUILD_COMMIT_SHORT=${{ env.SHORT_SHA }}
            ALUXEN_BUILD_REF=${{ github.ref_name }}
            ALUXEN_BUILD_TIME=${{ env.BUILD_TIME }}
            ALUXEN_BUILD_IMAGE=${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
            ALUXEN_BUILD_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ALUXEN_BUILD_NUMBER=${{ env.BUILD_NUMBER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
