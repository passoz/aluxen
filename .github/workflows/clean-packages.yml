name: Clean Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Test package API access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Testing GITHUB_TOKEN on packages API ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/passoz/packages/container/aluxen/versions | jq -r '.[].id // .'
