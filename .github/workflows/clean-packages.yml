name: Clean Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: List and delete compromised versions
        run: |
          set -e
          echo "=== 1. Fetching all package versions ==="
          VERSIONS_JSON=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/passoz/packages/container/aluxen/versions?per_page=100)
          
          echo "$VERSIONS_JSON" | jq -r '.[] | "ID: \(.id) | Created: \(.created_at) | Tags: \(.metadata.container.tags // [] | join(", "))"'
          
          echo ""
          echo "=== 2. Identifying versions to delete (everything except the latest clean build) ==="
          # The newest version with 'latest' tag was created today
          # We want to delete all versions that DO NOT have the clean commit sha (980739f or a6c61ae) and are older.
          
          # Find all version IDs that are NOT the latest clean build
          TO_DELETE=$(echo "$VERSIONS_JSON" | jq -r '
            .[] |
            select((.metadata.container.tags | contains(["latest"])) | not) |
            .id
          ')
          
          echo "Found $(echo "$TO_DELETE" | grep -c . || true) versions to delete."
          
          for VID in $TO_DELETE; do
            echo "Deleting version $VID..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/passoz/packages/container/aluxen/versions/$VID")
            echo "Version $VID delete status: $HTTP_CODE"
          done
          
          echo ""
          echo "=== 3. Remaining versions after cleanup ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/passoz/packages/container/aluxen/versions | jq -r '.[] | "ID: \(.id) | Tags: \(.metadata.container.tags // [] | join(", "))"'
