name: CI

on:
  push:
    branches: [main, devgo]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: sqlc (queries em sincronia com o schema)
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f sqlc.sqlite.yaml
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f sqlc.postgres.yaml
          git diff --exit-code -- internal/infrastructure/db/sqlite/sqlcgen internal/infrastructure/db/postgres/sqlcgen

  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./... -race -coverprofile=coverage.out
      - name: Gate de cobertura >= 90%
        run: go tool cover -func=coverage.out | awk '/^total:/{if ($3+0 < 90.0) exit 1}'

  security:
    name: Segredos & vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t aluxen:${{ github.sha }} .
