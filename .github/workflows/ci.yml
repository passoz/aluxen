name: CI

on:
  push:
    branches: [main, devgo]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: sqlc (queries em sincronia com o schema)
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f sqlc.sqlite.yaml
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f sqlc.postgres.yaml
          git diff --exit-code -- internal/infrastructure/db/sqlite/sqlcgen internal/infrastructure/db/postgres/sqlcgen

  test:
    name: Testes + cobertura
    runs-on: ubuntu-latest
    # O produto promete SQLite E Postgres: os adapters do segundo dialeto só são
    # exercitados com um banco de verdade, então o job sobe um Postgres e aponta
    # TEST_DATABASE_URL para ele. `-coverpkg=./...` mede a cobertura entre
    # pacotes — os adapters e o código gerado pelo sqlc são exercitados pelos
    # testes da camada de banco, não por testes próprios.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aluxen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aluxen?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test ./... -race -coverpkg=./... -coverprofile=coverage.out
      - name: Gate de cobertura >= 90%
        run: go tool cover -func=coverage.out | awk '/^total:/{if ($3+0 < 90.0) exit 1}'

  security:
    name: Segredos & vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t aluxen:${{ github.sha }} .
