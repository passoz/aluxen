<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#85e6c0">
  <title>Aluxen | Offline</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f7f4e8; color: #0b0b0d; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    section { max-width: 420px; background: #fffdf5; border: 1px solid #cfe5dc; border-radius: 18px; padding: 24px; box-shadow: 0 10px 30px rgba(107, 179, 155, 0.18); }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Sem conexão</h1>
      <p>Abra o Aluxen novamente quando a internet voltar. Se voce ja acessou o painel antes, os dados em cache e as alteracoes pendentes continuam disponiveis no app instalado.</p>
    </section>
  </main>
</body>
</html>
